<!DOCTYPE html>
<html>
<head>
    <title>Discord Event Bot Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        td, th { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
        button { margin-top: 10px; padding: 6px 12px; cursor: pointer; }
        input { width: 100%; box-sizing: border-box; padding: 4px; }
        .controls { margin-top: 10px; }
        .note { margin-top: 10px; font-size: 0.9em; color: #555; }
        .container { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>
<div class="container">
    <h1>Discord Event Bot Dashboard</h1>
    <p>Manage the list of users that the bot will rotate events through.</p>

    <table id="userTable">
        <thead>
            <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Timezone (optional)</th>
                <th>Remove</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="controls">
        <button onclick="addUser()">Add User</button>
        <button onclick="saveUsers()">Save Changes</button>
    </div>

    <p class="note">
        • User ID is the Discord snowflake (right-click user &gt; Copy ID).<br>
        • Timezone is optional; Discord timestamps auto-adjust per user.
    </p>
</div>

<script src="dashboard.js"></script>
</body>
</html>
